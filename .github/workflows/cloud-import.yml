name: cloud-import
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cloud-import
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run import pipeline
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: python cloud_import.py
      - name: Commit result and remove inputs
        run: |
          git config user.name "cloud-import-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cloud/result.json
          git rm -f cloud/words.txt cloud/lib.json || true
          git commit -m "cloud import result $(date -u '+%m-%d %H:%M')" || echo "nothing to commit"
          git push
